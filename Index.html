<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart BDFlip — BD Hunter</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at top,#173b70,#071225 60%,#030712);min-height:100vh}
.wrap{max-width:1050px;margin:auto;padding:18px}h1{text-align:center;margin:4px 0;font-size:clamp(25px,5vw,48px);text-shadow:0 0 18px #59d8ff}.sub{text-align:center;color:#b9eaff;margin-bottom:14px}
.panel{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.card{background:#ffffff12;border:1px solid #ffffff25;border-radius:18px;padding:12px;text-align:center}.big{font-size:34px;font-weight:800}.target{font-size:42px;color:#ffe66d;text-shadow:0 0 15px #ffe66d}
button{border:0;border-radius:14px;padding:12px 20px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#54e7ff,#786cff);color:#071225;font-size:16px}
#game{position:relative;height:min(58vh,560px);min-height:360px;margin-top:14px;border-radius:25px;border:1px solid #54e7ff55;overflow:hidden;background:linear-gradient(#081a38cc,#061024ee);box-shadow:inset 0 0 50px #54e7ff18}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:40px 40px}
.letter{position:absolute;width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;cursor:pointer;user-select:none;transition:transform .12s}.letter:hover{transform:scale(1.12)}
.b{background:#ff315c;color:#fff;box-shadow:0 0 25px #ff315c99}.d{background:#25d878;color:#032914;box-shadow:0 0 25px #25d87899}
.pop{animation:pop .35s ease}@keyframes pop{50%{transform:scale(1.45);opacity:.5}100%{transform:scale(.2);opacity:0}}
.flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:900;pointer-events:none;opacity:0;text-shadow:0 0 20px #fff}
.footer{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:12px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}.modal .box{background:#0c1c37;border:1px solid #54e7ff66;border-radius:25px;padding:28px;max-width:500px;text-align:center}.reward{font-size:60px}.small{font-size:14px;color:#b9cce4}
</style></head><body><div class="wrap">
<h1>🪙 BD HUNTER — Smart BDFlip</h1><div class="sub">Cari dan tangkap huruf sasaran sebelum masa tamat!</div>
<div class="panel"><div class="card">SKOR<div class="big" id="score">0</div></div><div class="card">SASARAN<div class="target" id="target">b</div></div><div class="card">TOKEN<div class="big" id="tokens">0 🪙</div></div></div>
<div id="game"><div class="grid"></div><div id="flash" class="flash"></div></div>
<div class="footer"><div class="card">⏱️ Masa: <b id="time">30</b>s</div><div class="card">❤️ Nyawa: <b id="lives">3</b></div><button onclick="startGame()">▶ Mula Permainan</button><button onclick="showRules()">❔ Arahan</button></div></div>
<div class="modal" id="modal"><div class="box"><div class="reward">🏆🪙</div><h2 id="modalTitle">Syabas!</h2><p id="modalText"></p><button onclick="closeModal();startGame()">Main Lagi</button></div></div>
<script>
let score=0,tokens=0,lives=3,time=30,target='b',timer=null,running=false;const game=document.getElementById('game');
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function update(){scoreEl.textContent=score;tokensEl.textContent=tokens+' 🪙';livesEl.textContent=lives;timeEl.textContent=time;targetEl.textContent=target}
const scoreEl=document.getElementById('score'),tokensEl=document.getElementById('tokens'),livesEl=document.getElementById('lives'),timeEl=document.getElementById('time'),targetEl=document.getElementById('target');
function clearLetters(){document.querySelectorAll('.letter').forEach(x=>x.remove())}
function spawnLetters(){if(!running)return;clearLetters();let a=[target];for(let i=0;i<5;i++)a.push(target==='b'?'d':'b');if(score>0&&score%3===0)a.push(target);a.sort(()=>Math.random()-.5);a.forEach(ch=>{let e=document.createElement('div');e.className='letter '+ch;e.textContent=ch;e.style.left=rand(2,91)+'%';e.style.top=rand(3,78)+'%';e.onclick=()=>catchLetter(e,ch);game.appendChild(e)})}
function flash(t){let f=document.getElementById('flash');f.textContent=t;f.style.opacity=1;setTimeout(()=>f.style.opacity=0,500)}
function catchLetter(e,ch){if(!running)return;if(ch===target){e.classList.add('pop');score++;tokens++;flash('✨ +1 TOKEN ✨');if(score%5===0){tokens+=2;flash('🌟 BONUS +2 TOKEN 🌟')}target=target==='b'?'d':'b';update();setTimeout(spawnLetters,220)}else{e.classList.add('pop');lives--;flash('❌ Cuba lagi!');update();if(lives<=0)endGame()}}
function startGame(){clearInterval(timer);clearLetters();score=0;tokens=0;lives=3;time=30;target=Math.random()<.5?'b':'d';running=true;update();spawnLetters();timer=setInterval(()=>{time--;update();if(time<=0)endGame()},1000)}
function endGame(){running=false;clearInterval(timer);clearLetters();document.getElementById('modalTitle').textContent='Permainan Tamat! 🎉';document.getElementById('modalText').innerHTML='Skor: <b>'+score+'</b><br>Token: <b>'+tokens+' 🪙</b>';document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
function showRules(){document.getElementById('modalTitle').textContent='Cara Bermain';document.getElementById('modalText').innerHTML='1. Lihat huruf sasaran.<br>2. Cari dan klik huruf yang sama.<br>3. Jawapan betul = +1 token 🪙.<br>4. Setiap 5 jawapan betul = bonus 2 token.<br>5. Elakkan huruf yang salah!';document.getElementById('modal').style.display='flex'}
update();
</script></body></html>
